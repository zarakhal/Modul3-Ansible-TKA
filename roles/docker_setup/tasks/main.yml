---
- name: Memastikan Firewall (UFW) terinstal
  apt:
    name: ufw
    state: present
    update_cache: yes

- name: Mengizinkan akses SSH (Port 22) pada Firewall
  ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Menyalakan Firewall (UFW) secara default
  ufw:
    state: enabled
    policy: deny

- name: Menginstal prasyarat Docker
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: yes

- name: Menambahkan GPG key resmi Docker
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Menambahkan repository Docker
  apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present

- name: Menginstal Docker Engine
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
    state: present
    update_cache: yes

- name: Memastikan service Docker berjalan
  systemd:
    name: docker
    state: started
    enabled: yes

- name: Memasukkan user ubuntu ke grup docker
  user:
    name: ubuntu
    groups: docker
    append: yes

